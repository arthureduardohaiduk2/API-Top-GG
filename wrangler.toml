name = "topggapi"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
# Variáveis públicas podem vir aqui, mas lembre-se:
# DISCORD_BOT_TOKEN e TOPGG_WEBHOOK_AUTH DEVEM ser salvos nas Secrets do painel da Cloudflare!
name = "topgg-vote-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Banco KV para salvar os lembretes
kv_namespaces = [
  { binding = "VOTES_KV", id = "COLE_O_SEU_ID_DO_KV_AQUI" }
]

# Alarme do Cloudflare que roda a cada 5 minutos
[triggers]
crons = ["*/5 * * * *"]
